# 開発用オーバーライド。
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
# バインドマウント + ホットリロードで動かす。

services:
  frontend:
    build:
      target: dev
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      target: dev
    # dev イメージ（golang）には prod のバイナリが無いので、
    # 一度ビルドしてから起動する。compose.yaml の healthcheck
    # （/app/server -healthcheck）を dev でも成立させるため。
    command: sh -c "mkdir -p /app && go build -o /app/server ./cmd/server && exec /app/server"
    volumes:
      - ./backend:/src
      - go-mod-cache:/go/pkg/mod
    # bootstrap 元 (skill/ の training.db) は compose.yaml の
    # ./skill/...:/bootstrap:ro をそのまま継承する。

  nginx:
    ports:
      - "8081:80"   # dev はホスト 8081 で公開（8080は既に使用中のため）

volumes:
  go-mod-cache:
