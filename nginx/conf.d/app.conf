# training-record リバースプロキシ
# 自宅 LAN 内 HTTP 提供。TLS を使う場合は listen 443 ssl の server ブロックを別途追加（任意）。
#
# パスの役割:
#   /api/  → backend 直（Hermes Agent 用。呼び出し側が API キーを保持する）
#   /bff/  → frontend の Next.js Route Handler（ブラウザ用。サーバ側でキーを付与して backend へ転送）
#   /      → frontend（Next.js 本体・静的アセット含む）

upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream  { server backend:8080; }

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # ---- Hermes Agent 用の API: backend へ直送 ----
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- スピン画像抽出: frontend へ（アップロード + LLM 応答のため緩める） ----
    #       POST /bff/spin-extract は画像 (~10MB) を受け付け、Hermes Agent の
    #       画像解析（数十秒）を待つため、この経路だけ上限を緩和する。
    location /bff/spin-extract {
        client_max_body_size 12m;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- それ以外（ブラウザ・/bff・/_next 等）: frontend へ ----
    #      Next.js が静的アセットの Cache-Control を自前で付けるのでここでは触らない。
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
