apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: training-record
  labels:
    app: backend
spec:
  # SQLite + ReadWriteOnce PVC のため常に 1 Pod・Recreate 戦略で更新する
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: backend
          image: docker-registry.g00cey.main/training-record/backend:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: training-record-config
            - secretRef:
                name: training-record-secret
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: training-backups
              mountPath: /backups
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data
        - name: training-backups
          persistentVolumeClaim:
            claimName: training-backups
