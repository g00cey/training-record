name: training-record

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      # - "443:443"   # 自己署名 TLS を使う場合のみ有効化（任意）
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # ブラウザ用のベースパス。Next.js Route Handler (/bff/[...path]) が
        # サーバ側で API キーを付与して backend へ転送する。
        NEXT_PUBLIC_API_BASE: /bff
    environment:
      NODE_ENV: production
      # SSR / Route Handler からの内部呼び出し先（compose ネットワーク内）
      INTERNAL_API_BASE: http://backend:8080/api
      # backend 呼び出し時に付与する API キー（ブラウザには出さない）
      API_KEY: ${API_KEY:?set API_KEY in .env}
      TZ: Asia/Tokyo
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      PORT: "8080"
      DB_PATH: /data/training.db
      # 初回のみ: 既存 training.db をここから一度だけ取り込む。無ければスキップ
      BOOTSTRAP_DB_PATH: /bootstrap/training.db
      API_KEY: ${API_KEY:?set API_KEY in .env}
      # スピン画像抽出（POST /api/spin-extract・Phase 7）。未設定なら 503（機能無効）
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # LLM トレーニング評価（server -evaluate-training・Phase 8）。未設定ならバッチ失敗
      LLM_EVAL_API_URL: ${LLM_EVAL_API_URL:-}
      LLM_EVAL_API_KEY: ${LLM_EVAL_API_KEY:-}
      LLM_EVAL_HISTORY_WEEKS: ${LLM_EVAL_HISTORY_WEEKS:-8}
      TZ: Asia/Tokyo
    volumes:
      - training-data:/data
      - ./skill/.hermes/home/.hermes/training-logs:/bootstrap:ro
    expose:
      - "8080"
    healthcheck:
      # server バイナリの -healthcheck サブコマンドで /api/health を自己確認する
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      # ofelia（下記サービス）が1日1回 job-exec で叩く定期トレーニング評価バッチ
      ofelia.enabled: "true"
      ofelia.job-exec.training-evaluation.schedule: "0 0 3 * * *" # 毎日 03:00 JST
      ofelia.job-exec.training-evaluation.command: "/app/server -evaluate-training"

  # 定期トレーニング評価（Phase 8）用のジョブスケジューラ。docker.sock 経由で
  # backend コンテナに job-exec するだけで、それ自体は API を持たない。
  # docker.sock マウントはホストに対して強い権限を持つが、本プロジェクトは
  # 自宅 LAN 内限定・外部非公開が前提（docs/architecture.md）のため許容している。
  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  training-data:

networks:
  # llm/docker-compose.yml から external network として参照される
  # （backend からスピン画像抽出サーバーへコンテナ名で到達できるようにする）
  default:
    name: training-record_default
