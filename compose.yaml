name: training-record

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      # - "443:443"   # 自己署名 TLS を使う場合のみ有効化（任意）
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # ブラウザ用のベースパス。Next.js Route Handler (/bff/[...path]) が
        # サーバ側で API キーを付与して backend へ転送する。
        NEXT_PUBLIC_API_BASE: /bff
    environment:
      NODE_ENV: production
      # SSR / Route Handler からの内部呼び出し先（compose ネットワーク内）
      INTERNAL_API_BASE: http://backend:8080/api
      # backend 呼び出し時に付与する API キー（ブラウザには出さない）
      API_KEY: ${API_KEY:?set API_KEY in .env}
      TZ: Asia/Tokyo
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      PORT: "8080"
      DB_PATH: /data/training.db
      # 初回のみ: 既存 training.db をここから一度だけ取り込む。無ければスキップ
      BOOTSTRAP_DB_PATH: /bootstrap/training.db
      API_KEY: ${API_KEY:?set API_KEY in .env}
      # スピン画像抽出（POST /api/spin-extract・Phase 7）。未設定なら 503（機能無効）
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      TZ: Asia/Tokyo
    volumes:
      - training-data:/data
      - ./skill/.hermes/home/.hermes/training-logs:/bootstrap:ro
    expose:
      - "8080"
    healthcheck:
      # server バイナリの -healthcheck サブコマンドで /api/health を自己確認する
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  training-data:
