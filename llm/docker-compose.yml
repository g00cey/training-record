services:
  spin-extraction:
    build: .
    container_name: spin-extraction
    restart: unless-stopped
    ports:
      - "8646:8646"
    env_file:
      - .env
    networks:
      - training-record_default
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8646/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  # backend/frontend (compose.yaml) と同一ネットワーク。
  # training-record 側で先に起動しておく必要がある（make up の順序に依存）。
  training-record_default:
    external: true
